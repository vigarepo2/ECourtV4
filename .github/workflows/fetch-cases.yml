name: Fetch eCourts Cases

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Re-fetch cases that already have valid JSON files"
        required: false
        type: boolean
        default: false
      delay:
        description: "Delay between CNR requests in seconds"
        required: true
        type: string
        default: "1.5"
      max_attempts:
        description: "Maximum attempts per failed CNR"
        required: true
        type: string
        default: "6"

permissions:
  contents: write

concurrency:
  group: ecourts-v4-fetch
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch all CNR cases
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests pycryptodome

      - name: Fetch cases
        env:
          ECOURTS_FORCE_REFRESH: ${{ inputs.force_refresh }}
          ECOURTS_DELAY: ${{ inputs.delay }}
          ECOURTS_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: python fetchcases.py

      - name: Commit generated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No case-data changes to commit."
          else
            git commit -m "Update eCourts case data"
            git push
          fi

      - name: Verify all CNRs completed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failed = Path("failed.json")
          if failed.exists():
              data = json.loads(failed.read_text(encoding="utf-8"))
              count = int(data.get("total_failed", 0))
              if count:
                  print(f"{count} CNR(s) remain incomplete. Re-run the workflow; valid existing case files will be skipped.")
                  for item in data.get("failed", [])[:25]:
                      print(f"- {item.get('cnr')}: {item.get('error')}")
                  raise SystemExit(1)

          cases = Path("cases.json")
          if not cases.exists():
              raise SystemExit("cases.json was not generated")

          data = json.loads(cases.read_text(encoding="utf-8"))
          print(f"Complete: {data.get('total', 0)} case(s) in cases.json")
          PY
